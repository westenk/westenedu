<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Clicker Game</title>
<style>
  body{font-family:sans-serif;text-align:center;margin-top:50px;}
  #counter{font-size:48px;margin:20px;}
  button{font-size:24px;padding:10px 20px;}
</style>
</head>
<body>
<h1>Clicker Game</h1>
<div id="counter">0</div>
<button id="clickBtn">Click!</button>
<button id="upgradeBtn">Upgrade (cost 100)</button>
<p>Multiplier: <span id="multiplier">1</span></p>

<script>
let clicks = 0;
let mult = 1;
const counter = document.getElementById('counter');
const multEl = document.getElementById('multiplier');

document.getElementById('clickBtn').onclick = () => {
  clicks += mult;
  counter.textContent = clicks;
};

document.getElementById('upgradeBtn').onclick = () => {
  if (clicks >= 100) {
    clicks -= 100;
    mult *= 2;
    multEl.textContent = mult;
    counter.textContent = clicks;
  }
};
</script>
</body>
</html>
